<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555" />
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="480" fill="#ffffff" />

  <!-- Browser -->
  <rect x="30" y="30" width="160" height="60" rx="8" fill="#f5f5f5" stroke="#999" />
  <text x="110" y="65" text-anchor="middle" font-size="14" fill="#222">Browser</text>

  <!-- React SPA -->
  <rect x="250" y="30" width="200" height="60" rx="8" fill="#e6f0ff" stroke="#5b8def" />
  <text x="350" y="55" text-anchor="middle" font-size="13" fill="#1a3d7c" font-weight="600">React + Vite SPA</text>
  <text x="350" y="73" text-anchor="middle" font-size="11" fill="#1a3d7c">web/ — alerts, subgraph, cases</text>

  <!-- Fastify API -->
  <rect x="550" y="30" width="200" height="60" rx="8" fill="#e6f0ff" stroke="#5b8def" />
  <text x="650" y="55" text-anchor="middle" font-size="13" fill="#1a3d7c" font-weight="600">Fastify API</text>
  <text x="650" y="73" text-anchor="middle" font-size="11" fill="#1a3d7c">JWT auth, rate limit, /metrics</text>

  <!-- arrows top row -->
  <line x1="190" y1="60" x2="248" y2="60" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="450" y1="60" x2="548" y2="60" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Neo4j -->
  <rect x="470" y="180" width="180" height="70" rx="8" fill="#e9f7ef" stroke="#3fa66a" />
  <text x="560" y="208" text-anchor="middle" font-size="13" fill="#1e6b3f" font-weight="600">Neo4j</text>
  <text x="560" y="226" text-anchor="middle" font-size="11" fill="#1e6b3f">accounts, transactions, entities</text>
  <text x="560" y="241" text-anchor="middle" font-size="11" fill="#1e6b3f">detection rules (Cypher)</text>

  <!-- Postgres -->
  <rect x="700" y="180" width="180" height="70" rx="8" fill="#fdf2e3" stroke="#d99a2b" />
  <text x="790" y="208" text-anchor="middle" font-size="13" fill="#8a5a10" font-weight="600">Postgres</text>
  <text x="790" y="226" text-anchor="middle" font-size="11" fill="#8a5a10">alerts, cases, users, risk scores</text>
  <text x="790" y="241" text-anchor="middle" font-size="11" fill="#8a5a10">audit trail</text>

  <!-- arrows API -> stores -->
  <line x1="660" y1="90" x2="565" y2="178" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="700" y1="90" x2="785" y2="178" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Redis/BullMQ -->
  <rect x="240" y="180" width="200" height="70" rx="8" fill="#fdeaea" stroke="#d9534f" />
  <text x="340" y="208" text-anchor="middle" font-size="13" fill="#8c2e2b" font-weight="600">Redis / BullMQ</text>
  <text x="340" y="226" text-anchor="middle" font-size="11" fill="#8c2e2b">ingestion queue</text>
  <text x="340" y="241" text-anchor="middle" font-size="11" fill="#8c2e2b">(async, idempotent by txn id)</text>

  <line x1="620" y1="90" x2="380" y2="178" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Worker -->
  <rect x="240" y="320" width="200" height="60" rx="8" fill="#f0eaff" stroke="#8a63d2" />
  <text x="340" y="345" text-anchor="middle" font-size="13" fill="#4b2e8c" font-weight="600">Ingestion Worker</text>
  <text x="340" y="363" text-anchor="middle" font-size="11" fill="#4b2e8c">batches transactions -&gt; graph writes</text>

  <line x1="340" y1="250" x2="340" y2="318" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="400" y1="320" x2="530" y2="252" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- caption -->
  <text x="30" y="430" font-size="12" fill="#666">Ingestion: CSV/JSON -&gt; API validates &amp; enqueues -&gt; worker drains queue -&gt; writes to Neo4j (dedup by transaction id).</text>
  <text x="30" y="450" font-size="12" fill="#666">Detection: POST /detection/run walks the graph (structuring, cycles, fan-in/out, mule networks) -&gt; alerts + risk scores persist to Postgres.</text>
</svg>
