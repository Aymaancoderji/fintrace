# Full containerized stack: infrastructure + API + worker + web UI.
#
#   cp .env.docker.example .env.docker
#   docker compose -f docker-compose.prod.yml --env-file .env.docker up --build
#
# Web UI: http://localhost:8080   API: http://localhost:3000

services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        ['CMD-SHELL', 'cypher-shell -u neo4j -p "$$NEO4J_PASSWORD" "RETURN 1" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fintrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: fintrace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fintrace -d fintrace']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies Neo4j constraints/indexes and Postgres schema, then exits.
  # api and worker wait for this to complete successfully.
  migrate:
    build: .
    command: sh -c "node dist/db/migrate.js && node dist/db/migratePostgres.js"
    environment: &backend_env
      NODE_ENV: production
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      DATABASE_URL: postgres://fintrace:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/fintrace
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build: .
    command: node dist/index.js
    environment: *backend_env
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build: .
    command: node dist/worker.js
    environment: *backend_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        # Baked in at build time — Vite inlines env vars into the bundle.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    ports:
      - '8080:80'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  neo4j_data:
  postgres_data:
  redis_data:
